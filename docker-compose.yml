services:
  videocms:
    image: 'chrissoe/videocms:latest'
    restart: unless-stopped
    volumes:
      - '/data/videocms/videos:/app/videos'
      - '/data/videocms/database:/app/database'
    environment:
      PublisherMode: "${PublisherMode:-local}"
      PublisherSSHHost: "${PublisherSSHHost:-}"
      PublisherSSHPort: "${PublisherSSHPort:-22}"
      PublisherSSHUser: "${PublisherSSHUser:-}"
      PublisherSSHPassword: "${PublisherSSHPassword:-}"
      PublisherSSHKey: "${PublisherSSHKey:-}"
      PublisherSSHRemoteRoot: "${PublisherSSHRemoteRoot:-}"
    expose:
      - '3000'
    labels:
      caddy_0.request_body.max_size: 5G
